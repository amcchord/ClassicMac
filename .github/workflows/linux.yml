name: Linux desktop
on:
  push:
    branches: [codex/windows-app, codex/linux-release]
  workflow_dispatch:
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: engine
        with:
          path: |
            output/desktop/runtime
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
          key: linux-engine-${{ hashFiles('ati/*.c', 'ati/*.h', '**/*.patch','qfb/*','screamer/*','shared/*','ppcvid/qemu_vga.ndrv','scripts/build-qemu.sh','desktop/scripts/build-linux.sh','desktop/scripts/stage-linux.py') }}
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-venv python3-pip libglib2.0-dev libpixman-1-dev libslirp-dev libgcrypt20-dev libfdt-dev libpng-dev libzstd-dev libattr1-dev libcap-ng-dev libpulse-dev libasound2-dev libegl1-mesa-dev libgles2-mesa-dev patchelf xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libatk-bridge2.0-0t64 libfuse2t64 fuse3
      - name: Build Linux engines
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          desktop/scripts/build-linux.sh
          tar --exclude=.git --exclude=build --exclude=build-linux -czf output/desktop/ClassicMac-Linux-QEMU-source.tar.gz -C vendor qemu
      - name: Include qualified Tools CD
        if: steps.engine.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.0.0 -p ClassicMac-4.0.0.zip -D output/desktop/tools
          echo 'fb40c282cacc474b99a71ab23d8031f06a85e1dcf2b47c532552a640a1c1a37c  output/desktop/tools/ClassicMac-4.0.0.zip' | sha256sum -c
          unzip -p output/desktop/tools/ClassicMac-4.0.0.zip ClassicMac.app/Contents/Resources/ClassicMacTools.iso > output/desktop/runtime/ClassicMacTools.iso
      - uses: actions/cache/save@v4
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          path: |
            output/desktop/runtime
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
          key: ${{ steps.engine.outputs.cache-primary-key }}
      - name: Check Linux display devices
        run: python3 ati/tests/test_qemu_ati.py --gl-api gles --gl-optional output/desktop/runtime/bin/qemu-system-ppc output/desktop/runtime/qemu/pc-bios
      - name: Check Power Mac sound DMA timing
        run: python3 screamer/tests/qtest_screamer.py --qemu output/desktop/runtime/bin/qemu-system-ppc --share output/desktop/runtime/qemu/pc-bios --run output/desktop/screamer-timing
      - name: Build native C++ frontend
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland libssl-dev zlib1g-dev cmake
          cmake -S native -B output/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build output/native-build -j 4
          QT_QPA_PLATFORM=offscreen output/native-build/classicmac --self-test app/Tests/ClassicMacTests/Fixtures/Platinum output/native-pixels
          python3 native/scripts/package-linux.py output/native-build
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicMac-Linux-app
          path: |
            output/desktop/packages/*.AppImage
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
            output/native-pixels/*.json
          retention-days: 30
