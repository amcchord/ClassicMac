name: Linux desktop
on:
  push:
    branches: [codex/windows-app, codex/linux-release]
  workflow_dispatch:
    inputs:
      test_tiger:
        description: Boot a disposable Mac OS X 10.4.11 guest in the final package
        type: boolean
        default: false
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: engine
        with:
          path: |
            output/desktop/runtime
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
          key: linux-engine-${{ hashFiles('ati/*.c', 'ati/*.h', '**/*.patch','osx/**','scripts/build-osx-qemu.sh','qfb/*','screamer/*','shared/*','ppcvid/qemu_vga.ndrv','scripts/build-qemu.sh','desktop/scripts/build-linux.sh','desktop/scripts/stage-linux.py','.github/workflows/linux.yml') }}
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-venv python3-pip libglib2.0-dev libpixman-1-dev libslirp-dev libgcrypt20-dev libfdt-dev libpng-dev libzstd-dev libattr1-dev libcap-ng-dev libpulse-dev libasound2-dev libegl1-mesa-dev libgles2-mesa-dev patchelf xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libatk-bridge2.0-0t64 libfuse2t64 fuse3
      - name: Build Linux engines
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          QEMU_REPO=https://github.com/qemu/qemu.git desktop/scripts/build-linux.sh
          tar --exclude=.git --exclude=build --exclude=build-linux -czf output/desktop/ClassicMac-Linux-QEMU-source.tar.gz -C vendor qemu qemu-osx
      - name: Include qualified Tools CD
        if: steps.engine.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.6.1 -p ClassicMac-4.6.1.zip -D output/desktop/tools
          echo '6a29d2b05bb51eedae12ab02ab048ca98ce77fc5c8dc5d3b6ff16ce0a0f29350  output/desktop/tools/ClassicMac-4.6.1.zip' | sha256sum -c
          unzip -p output/desktop/tools/ClassicMac-4.6.1.zip ClassicMac.app/Contents/Resources/ClassicMacTools.iso > output/desktop/runtime/ClassicMacTools.iso
          echo '23a42184811c7e1ad8718b6746e061c3a1c3e3dd43af25c9c828b3fa326fca22  output/desktop/runtime/ClassicMacTools.iso' | sha256sum -c
      - uses: actions/cache/save@v4
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          path: |
            output/desktop/runtime
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
          key: ${{ steps.engine.outputs.cache-primary-key }}
      - name: Check Linux display devices
        run: python3 ati/tests/test_qemu_ati.py --gl-api gles --gl-optional output/desktop/runtime/bin/qemu-system-ppc output/desktop/runtime/qemu/pc-bios
      - name: Check Mac OS X flash persistence
        run: python3 osx/tests/qtest_macosx_flash.py --qemu output/desktop/runtime/bin/qemu-system-ppc-osx --firmware output/desktop/runtime/qemu-osx --seed-file output/desktop/runtime/qemu-osx/macosx-flash-seed.img
      - name: Check Radeon cursor pixels and clipping
        run: python3 ati/tests/test_radeon_cursor.py --qemu output/desktop/runtime/bin/qemu-system-ppc --support output/desktop/runtime/qemu/pc-bios --output output/desktop/radeon-cursor
      - name: Check Quadra shared display pixels
        run: python3 display/tests/test_quadra_frame.py output/desktop/runtime/bin/qemu-system-m68k
      - name: Check Power Mac sound DMA timing
        run: python3 screamer/tests/qtest_screamer.py --qemu output/desktop/runtime/bin/qemu-system-ppc --share output/desktop/runtime/qemu/pc-bios --run output/desktop/screamer-timing
      - name: Build native C++ frontend
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland libssl-dev zlib1g-dev cmake
          cmake -S native -B output/native-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build output/native-build -j 4
          QT_QPA_PLATFORM=offscreen output/native-build/classicmac --self-test app/Tests/ClassicMacTests/Fixtures/Platinum output/native-pixels
          python3 native/scripts/package-linux.py output/native-build
      - name: Boot Tiger in the packaged AppImage
        if: inputs.test_tiger
        run: |
          sudo apt-get install -y p7zip-full
          python3 osx/tests/fetch_tiger_fixture.py output/osx-qa/Tiger.classic \
            --qemu-img output/desktop/runtime/bin/qemu-img
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            output/desktop/packages/ClassicMac-4.7.0-linux-x64.AppImage --qualify-osx output/osx-qa/Tiger.classic
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicMac-Linux-app
          path: |
            output/desktop/packages/*.AppImage
            output/desktop/ClassicMac-Linux-QEMU-source.tar.gz
            output/native-pixels/*.json
            output/desktop/radeon-cursor/result.json
          retention-days: 30
