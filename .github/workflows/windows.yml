name: Windows desktop
on:
  workflow_dispatch:
concurrency:
  group: windows-guest-range-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClassicMac-Windows-app
          path: output/package-download
          run-id: '44202066871'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ClassicMac-Windows-runtime
          path: output/desktop/runtime
          run-id: '44202066871'
          github-token: ${{ github.token }}
      - name: Prepare checksum-pinned Tiger disk
        shell: pwsh
        run: |
          python osx/tests/fetch_tiger_fixture.py output/osx-qa/Tiger.classic --qemu-img output/desktop/runtime/bin/qemu-img.exe --seven-zip 'C:\Program Files\7-Zip\7z.exe'
      - name: Run the exact portable EXE with a bounded guest check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Get-ChildItem -Path output/package-download -Filter 'ClassicMac-4.7.0-windows-x64.exe' -Recurse).FullName
          $folder = (Resolve-Path output/osx-qa/Tiger.classic).Path
          python -c "import subprocess,sys; subprocess.run(sys.argv[1:], timeout=250, check=True); print('Portable EXE completed Tiger guest qualification.',flush=True)" $exe --qualify-osx $folder
